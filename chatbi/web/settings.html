<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理 · ChatBI</title><link rel="stylesheet" href="/static/styles.css"><body class="account-page"><main class="settings-page">
<header class="panel-header"><div><a href="/">← 返回问数</a><h1>工作台管理</h1><p id="account"></p></div><button id="logout" class="text-button">退出登录</button></header>
<p id="management-message" role="status"></p>
<section class="panel" id="source-section"><h2>数据源</h2><div id="sources"></div><details data-admin><summary>接入 MySQL 数据源</summary>
<form id="source-form" class="management-form"><label>名称<input name="name" required></label><label>地址<input name="host" required value="127.0.0.1"></label><label>端口<input name="port" type="number" value="3306" required></label><label>库名<input name="database" required></label><label>只读用户名<input name="user" required autocomplete="off"></label><label>密码<input name="password" type="password" required autocomplete="new-password"></label><label>TLS CA 文件路径（远程建议启用）<input name="ssl_ca"></label><button type="button" id="discover" class="text-button">连接并读取表结构</button><fieldset id="schema-selection"><legend>允许查询的表和字段</legend></fieldset><button type="submit" class="primary">保存数据源</button><button type="button" id="cancel-source-edit" class="text-button" hidden>取消编辑</button></form></details>
<details data-admin><summary>数据源授权</summary><form id="grant-form" class="management-form"><label>数据源<select name="source_id" required></select></label><label>用户<select name="user_id" required></select></label><label>权限 JSON（表、行过滤和脱敏字段）<textarea name="policy" rows="5" required>{"tables":[],"row_filters":[],"sensitive_fields":[]}</textarea></label><button class="primary">保存授权</button><button type="button" id="revoke-grant" class="text-button">撤销所选用户授权</button></form></details></section>
<section class="panel" data-admin><h2>账号管理</h2><div id="users"></div><details><summary>添加账号</summary><form id="user-form" class="management-form"><label>用户名<input name="username" required></label><label>密码（至少12位）<input name="password" type="password" required minlength="12" autocomplete="new-password"></label><label>租户<input name="tenant" value="default" required></label><label>角色<select name="role"><option value="analyst">分析员</option><option value="reviewer">审核员</option><option value="admin">管理员</option></select></label><button class="primary">创建账号</button></form></details></section>
<section class="panel" id="feedback"><h2>反馈案例库</h2><p>将个人历史中的错误结果修正为标准案例，审核后用于召回与回归测试。标准结果需独立核对。</p><div id="feedback-list"></div><details><summary>新增修正案例</summary><form id="feedback-form" class="management-form"><label>历史记录 ID<input name="query_id" required></label><label>修正说明<textarea name="note" required></textarea></label><label>标准只读 SQL<textarea name="sql" rows="5" required></textarea></label><label>独立核对的预期结果 JSON（columns、rows）<textarea name="expected" rows="5" required>{"columns":[],"rows":[]}</textarea></label><button class="primary">保存草稿并校验</button></form></details><button id="export-feedback" class="text-button">导出已发布回归案例</button></section>
</main><script type="module" src="/static/settings.mjs"></script></body></html>
