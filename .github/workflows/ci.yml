name: Code quality
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  central-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chatbi_ci
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: chatbi_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U chatbi_ci -d chatbi_control"
          --health-interval=3s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Real PostgreSQL identity, catalog and shared lease checks
        env:
          CHATBI_CONTROL_PG_URL: postgresql://chatbi_ci:isolated-ci-only@127.0.0.1:5432/chatbi_control
        run: uv run pytest tests/test_central_control.py -q --junitxml=reports/central-control.xml
      - name: Reject skipped central-store verification
        run: >-
          uv run python -c "import xml.etree.ElementTree as E;
          r=E.parse('reports/central-control.xml').getroot();
          assert not list(r.iter('skipped'))"
      - name: Restore an isolated central-store backup
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          CHATBI_BACKUP_SOURCE_URL: postgresql://chatbi_ci:isolated-ci-only@127.0.0.1:5432/chatbi_control
          CHATBI_BACKUP_RESTORED_URL: postgresql://chatbi_ci:isolated-ci-only@127.0.0.1:5432/chatbi_restore
        run: |
          docker exec "$PG_CONTAINER" pg_dump -U chatbi_ci -d chatbi_control > /tmp/chatbi-control.sql
          docker exec "$PG_CONTAINER" createdb -U chatbi_ci chatbi_restore
          docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U chatbi_ci -d chatbi_restore < /tmp/chatbi-control.sql
          uv run python scripts/check_control_restore.py
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Launcher contracts (mock processes, no services started)
        shell: pwsh
        run: ./scripts/test_launcher.ps1
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --frozen
      - name: Basic secret scan
        run: uv run python scripts/scan_secrets.py
      - name: Backend unit tests
        run: uv run pytest -q --junitxml=reports/unit-tests.xml
      - run: uv run mypy chatbi
      - run: node --test tests/*.test.mjs
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: reports/unit-tests.xml
          retention-days: 14
